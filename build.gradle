plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // Mojang official mappings — no extra plugin needed. Switch to Parchment later if desired.
    mappings channel: 'official', version: "${minecraft_version}"

    // copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Remap SRG names in third-party mixin refmaps (KubeJS/IC2/…) to the official
            // mappings used by this dev runtime, so their @Inject targets (e.g. m_5705_) resolve.
            // Uses the SRG→MCP mapping ForgeGradle generates via the :createSrgToMcp task.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Local jars live in ./libs — see libs/README.md (only IC2Classic is sourced locally).
    flatDir { dir 'libs' }
    // Architectury API — official maven (architectury-forge for 1.19.2: 6.5.82..6.6.92).
    maven { url = 'https://maven.architectury.dev/' }
    // Saps.dev — KubeJS / Rhino (dev jars, so fg.deobf actually applies).
    maven {
        url = 'https://maven.saps.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    // BlameJared — JEI.
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    // CurseMaven — fallback for anything not on the above.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // --- IC2Classic: not on any maven, so it comes from the local flatDir repo. Using MODULE
    //     notation (group:name:version) instead of files(...) lets fg.deobf ACTUALLY remap the jar
    //     to dev mappings, so a real IC2 loads at runClient (dev test). The flatDir repo
    //     matches libs/IC2Classic-1.19.2-2.1.3.3.jar as `:IC2Classic:1.19.2-2.1.3.3` (group ignored). ---
    implementation fg.deobf("ic2:IC2Classic:1.19.2-2.1.3.3")

    // --- CarbonConfig (Speiger): mandatory runtime dependency of IC2Classic (needs >=1.19.2-2.0.0).
    //     Not on a plain maven; pulled from CurseForge via CurseMaven (project carbon-config=898104,
    //     file 7842759 = CarbonConfig-1.19.2-2.0.0 Forge). ---
    implementation fg.deobf("curse.maven:carbon-config-898104:7842759")

    // --- KubeJS + Rhino (maven → fg.deobf applies, so dev mappings match for runClient) ---
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")

    // --- Architectury API (required by KubeJS at runtime) ---
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // --- JEI (maven) ---
    compileOnly  fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly  fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // --- Advanced Solars (Molecular Transformer): not on any maven, local flatDir jar like
    //     IC2Classic. SOFT dependency — compileOnly so IC2RecipeApplier can reference
    //     AdvancedSolarsRecipes at compile time, runtimeOnly for runClient/dev parity with the
    //     real modpack. Guarded at runtime by ModList.isLoaded + try/catch (see
    //     IC2RecipeApplier#registerMolecularTransformer), so it's never a hard requirement. ---
    compileOnly  fg.deobf("trinsdar:advancedsolars:2.1.2")
    runtimeOnly  fg.deobf("trinsdar:advancedsolars:2.1.2")
}

// Reproducible manifest values pulled from gradle.properties
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Process mods.toml / pack.mcmeta with property substitution
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        kubejs_version_range   : kubejs_version_range,
        ic2_version_range      : ic2_version_range,
        jei_version_range      : jei_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
